<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dead Signal</title>
    <!-- share tech mono font -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/buttons.css">

<body>
<header id="top-bar" class="border-glow"><!-- for stats -->

        <button id="btn-menu-open" class="icon_btn">Menu</button>
        <button id="btn-journal">Journal</button>
        <button id="btn-map">Map</button>
        <button id="btn-open-inventory">Inventory</button>
    </div>
    <div>
        <p id="frequency">null</p>
        <p id="zone">null</p>
    </div>

</header>
<div id="menu-overlay" class="overlay hidden"></div><!-- to blur background -->
<aside id="side-menu" class="side-menu hidden">

        <h2>Menu</h2>
    </header>
    <div class="button-placement">
        <button id="btn-menu-close" class="btn-close">back</button>

        <button class="menu-link" id="btn-export">Export</button>
        <button id="btn-import">Import</button>
    </div>
</aside>
<section id="inventory" class="border-glow">
    <div id="inventory-container">
        <div id="inventory-items-list">
        </div>

        </div>
    </div>

</section>
<main><!-- main gameplay -->
    <section id="InOut">
        <div id="terminal-input" class="border-glow">
            <div id=permanent-button>
                <!--
            <button id="btn-print-hello">Print hi :D ( normal )</button>
            <button id="btn-print-hello-log">Print hi :D ( log )</button>
            <button id="btn-print-hello-alert">Print hi :D ( alert )</button>
            -->
                <button id="applyZone1">zone 1 ( truck_cabin )</button>
                <button id="applyZone2">zone 2(snowy_forest)</button>
            </div>

            <div id="zone-action"></div>
        </div>
        <div id="terminal-output" class="border-glow">

        </div>
    </section>
</main>

</html>
